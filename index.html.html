<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI — Your AI Workspace, Reimagined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080B18;
  --surface:#111827;
  --surface-2:#161f33;
  --primary:#7C3AED;
  --secondary:#22D3EE;
  --accent:#A78BFA;
  --text:#F8FAFC;
  --muted:#94A3B8;
  --border: rgba(148,163,184,0.14);
  --glow: 0 0 40px rgba(124,58,237,0.25);
  --radius: 18px;
  --radius-sm: 12px;
  --font-head: 'Space Grotesk', sans-serif;
  --font-body: 'Plus Jakarta Sans', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(124,58,237,0.18), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,0.12), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-head{font-family:var(--font-head); letter-spacing:-0.02em;}
a{color:inherit; text-decoration:none;}
button{font-family:var(--font-body); cursor:pointer;}
::selection{background:rgba(124,58,237,0.4);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.25); border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.4);}

.container{max-width:1240px; margin:0 auto; padding:0 28px;}

/* Glass surface */
.glass{
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
  border:1px solid var(--border);
  border-radius:var(--radius);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
.glass-hover{transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;}
.glass-hover:hover{ transform: translateY(-4px); border-color: rgba(167,139,250,0.4); box-shadow: 0 20px 50px -20px rgba(124,58,237,0.35);}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:12px 22px; border-radius:12px; font-weight:600; font-size:14.5px;
  border:1px solid transparent; transition: all .2s ease; white-space:nowrap;
}
.btn-primary{
  background: linear-gradient(135deg, var(--primary), #5b21b6 60%, var(--secondary));
  background-size:160% 160%;
  color:#fff; box-shadow: 0 10px 30px -8px rgba(124,58,237,0.55);
}
.btn-primary:hover{ background-position:100% 0; box-shadow: 0 14px 36px -8px rgba(124,58,237,0.75); transform:translateY(-1px);}
.btn-ghost{ background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--text);}
.btn-ghost:hover{ border-color:rgba(167,139,250,0.5); background:rgba(255,255,255,0.06);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}
.btn-icon{padding:9px; border-radius:10px; background:rgba(255,255,255,0.03); border:1px solid var(--border); display:inline-flex; align-items:center; justify-content:center;}
.btn-icon:hover{background:rgba(255,255,255,0.07); border-color:rgba(167,139,250,0.4);}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none !important;}

/* Inputs */
.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:13px; color:var(--muted); font-weight:600;}
.input, textarea.input, select.input{
  background:rgba(255,255,255,0.03); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:11px; font-size:14.5px; font-family:var(--font-body);
  outline:none; transition: border-color .2s ease, background .2s ease; width:100%;
}
.input:focus{ border-color:var(--accent); background:rgba(124,58,237,0.06); }
.input::placeholder{color:#5c6b83;}

/* badges */
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 11px; border-radius:99px; border:1px solid var(--border); color:var(--muted); background:rgba(255,255,255,0.03);}
.dot{width:6px; height:6px; border-radius:50%; background:var(--secondary); box-shadow:0 0 8px var(--secondary);}

.gradient-text{
  background: linear-gradient(90deg, var(--secondary), var(--accent) 50%, var(--primary));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

.hidden{display:none !important;}
.spin{animation: spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes floaty{0%,100%{transform:translateY(0);} 50%{transform:translateY(-14px);}}
@keyframes pulseGlow{0%,100%{opacity:.55;} 50%{opacity:1;}}
@keyframes fadeUp{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);}}
.fade-up{animation: fadeUp .6s ease both;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* Skeleton loader */
.skeleton{ background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 37%, rgba(255,255,255,0.04) 63%); background-size:400% 100%; animation: shimmer 1.4s ease infinite; border-radius:10px;}
@keyframes shimmer{0%{background-position:100% 0;} 100%{background-position:-100% 0;}}

/* Toast */
#toast-root{ position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
.toast{ min-width:260px; max-width:340px; padding:14px 16px; border-radius:12px; font-size:13.5px; font-weight:500; display:flex; align-items:center; gap:10px; animation: fadeUp .3s ease both; box-shadow:0 20px 40px -15px rgba(0,0,0,0.6);}
.toast.success{ background:#0f2e28; border:1px solid #1f5c4b; color:#9df5d3;}
.toast.error{ background:#331319; border:1px solid #6b1f2c; color:#ffb4c0;}
.toast.info{ background:var(--surface-2); border:1px solid var(--border); color:var(--text);}

/* Modal */
.modal-overlay{ position:fixed; inset:0; background:rgba(4,6,14,0.7); backdrop-filter:blur(6px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeUp .2s ease both;}
.modal-box{ width:100%; max-width:420px; padding:26px; }

/* Scrollbar-less horizontal chip row */
.chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.chip{ padding:8px 16px; border-radius:99px; font-size:13.5px; font-weight:600; border:1px solid var(--border); color:var(--muted); white-space:nowrap; background:rgba(255,255,255,0.02); transition: all .2s ease;}
.chip.active{ background:linear-gradient(135deg, var(--primary), var(--secondary)); color:#fff; border-color:transparent;}
.chip:hover:not(.active){border-color:rgba(167,139,250,0.5); color:var(--text);}

/* Scrollbar hide util */
.noscroll::-webkit-scrollbar{display:none;}

/* Focus visibility for accessibility */
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [onclick]:focus-visible{
  outline:2px solid var(--secondary); outline-offset:2px;
}

/* Responsive grids */
@media (max-width: 1000px){
  .grid-3{ grid-template-columns:repeat(2,1fr) !important; }
  .grid-4{ grid-template-columns:repeat(2,1fr) !important; }
}
@media (max-width: 700px){
  .grid-3, .grid-4, .grid-2{ grid-template-columns:1fr !important; }
  .nav-links{ display:none !important; }
  .topbar-search{ max-width:160px !important; }
  .hide-mobile{ display:none !important; }
}
@media (max-width: 900px){
  .mobile-only{ display:inline-flex !important; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<script>
/* ============ NEXORA AI — Application Core ============ */

const APP = document.getElementById('app');
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
const escapeHtml = (s='') => s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}
function fmtTime(iso){
  const d = new Date(iso);
  return d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
}
function fmtRelative(iso){
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs/24);
  if(days < 7) return `${days}d ago`;
  return fmtDate(iso);
}
function fmtBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}
function fmtNum(n){ return n.toLocaleString(); }

/* ============ Toast ============ */
function toast(msg, type='info'){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icon = type==='success' ? '✓' : type==='error' ? '✕' : 'ℹ';
  el.innerHTML = `<span style="font-weight:800">${icon}</span><span>${escapeHtml(msg)}</span>`;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-8px)'; el.style.transition='all .3s ease'; setTimeout(()=>el.remove(), 300); }, 3200);
}

/* ============ Persistent Storage Wrapper ============ */
const DB_KEY = 'nexora:v1';
async function dbLoad(){
  try{
    const res = await window.storage.get(DB_KEY, false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ /* not found or error */ }
  return null;
}
async function dbSave(data){
  try{
    await window.storage.set(DB_KEY, JSON.stringify(data), false);
  }catch(e){ console.error('storage save failed', e); toast('Could not save data — changes may not persist.', 'error'); }
}

function defaultData(user){
  return {
    user,
    conversations: [],
    files: [],
    prompts: [
      { id: uid(), title:'Weekly Report Summary', content:'Summarize the following weekly report into 5 concise bullet points highlighting key wins, risks, and next steps:', category:'Productivity', createdAt: nowISO() },
      { id: uid(), title:'Cold Outreach Email', content:'Write a short, friendly cold outreach email introducing our product to a potential B2B client in the SaaS space:', category:'Marketing', createdAt: nowISO() },
      { id: uid(), title:'Code Review Checklist', content:'Review the following code for bugs, readability issues, and performance improvements. List issues by severity:', category:'Development', createdAt: nowISO() },
    ],
    usage: [],
    favTools: [],
    settings: {
      theme:'dark', defaultModel:'nexora-pro', responseLength:'balanced',
      notifyEmail:true, notifyProduct:true, notifyUsage:false,
    },
    plan: 'Free',
  };
}

function seedUsageIfEmpty(data){
  if(data.usage && data.usage.length) return;
  const tools = ['AI Chat','AI Writer','Code Generator','AI Summarizer','Document Analyzer','AI Translator'];
  const usage = [];
  for(let i=27;i>=0;i--){
    const d = new Date(Date.now() - i*86400000);
    const reqs = Math.floor(Math.random()*6);
    for(let r=0;r<reqs;r++){
      usage.push({ tool: tools[Math.floor(Math.random()*tools.length)], tokens: Math.floor(200+Math.random()*1800), createdAt: d.toISOString() });
    }
  }
  data.usage = usage;
}

/* ============ Global App State ============ */
let DATA = null; // loaded data blob for current user
let VIEW = 'landing'; // landing | login | signup | forgot | app
let APP_TAB = 'home'; // home | chat | tools | files | history | prompts | analytics | billing | settings
let UI = { sidebarCollapsed:false, mobileNav:false, toolCategory:'All', toolSearch:'', historySearch:'', promptSearch:'', fileSearch:'', settingsTab:'profile' };

async function boot(){
  APP.innerHTML = landingLoadingSkeleton();
  const saved = await dbLoad();
  if(saved && saved.user){
    DATA = saved;
    seedUsageIfEmpty(DATA);
    VIEW = 'app';
  } else {
    VIEW = 'landing';
  }
  render();
}

function landingLoadingSkeleton(){
  return `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div style="width:44px;height:44px;border-radius:50%;border:3px solid rgba(124,58,237,0.25); border-top-color:var(--primary);" class="spin"></div>
  </div>`;
}

function setView(v){ VIEW = v; window.scrollTo(0,0); render(); }
function setTab(t){ APP_TAB = t; UI.mobileNav = false; render(); }

/* ============ Render Dispatcher ============ */
function render(){
  if(VIEW === 'landing') APP.innerHTML = viewLanding();
  else if(VIEW === 'login') APP.innerHTML = viewLogin();
  else if(VIEW === 'signup') APP.innerHTML = viewSignup();
  else if(VIEW === 'forgot') APP.innerHTML = viewForgot();
  else if(VIEW === 'app') APP.innerHTML = viewAppShell();
  afterRender();
}

function afterRender(){
  // hook: scroll active chat to bottom, focus composer, etc.
  if(VIEW === 'app' && APP_TAB === 'chat'){
    const box = document.getElementById('chat-scroll');
    if(box) box.scrollTop = box.scrollHeight;
  }
}

boot();
/* ============ Landing Page ============ */
function navPublic(){
  return `
  <header style="position:sticky; top:0; z-index:100; backdrop-filter:blur(16px); background:rgba(8,11,24,0.7); border-bottom:1px solid var(--border);">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between; height:74px;">
      ${logoMark()}
      <nav style="display:flex; gap:32px;" class="nav-links">
        <a href="#features" style="color:var(--muted); font-size:14.5px; font-weight:500;">Features</a>
        <a href="#tools" style="color:var(--muted); font-size:14.5px; font-weight:500;">AI Tools</a>
        <a href="#pricing" style="color:var(--muted); font-size:14.5px; font-weight:500;">Pricing</a>
        <a href="#faq" style="color:var(--muted); font-size:14.5px; font-weight:500;">FAQ</a>
      </nav>
      <div style="display:flex; gap:10px; align-items:center;">
        <button class="btn btn-ghost btn-sm" onclick="setView('login')">Log in</button>
        <button class="btn btn-primary btn-sm" onclick="setView('signup')">Get Started</button>
      </div>
    </div>
  </header>`;
}

function logoMark(sizeClass=''){
  return `<div style="display:flex; align-items:center; gap:10px; cursor:pointer;" onclick="setView('landing')">
    <div style="width:34px;height:34px;border-radius:10px; background:linear-gradient(135deg, var(--primary), var(--secondary)); position:relative; display:flex; align-items:center; justify-content:center; box-shadow:0 0 18px rgba(124,58,237,0.55);">
      <div style="width:12px;height:12px;border-radius:3px; background:#fff; transform:rotate(45deg);"></div>
    </div>
    <span class="font-head" style="font-weight:700; font-size:19px; letter-spacing:-0.01em;">NEXORA <span style="color:var(--secondary)">AI</span></span>

function heroOrb(){
  return `
  <div style="position:relative; width:100%; max-width:460px; aspect-ratio:1; margin:0 auto;">
    <div style="position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(167,139,250,0.9), rgba(124,58,237,0.5) 40%, rgba(34,211,238,0.15) 70%, transparent 75%); filter:blur(2px); animation: pulseGlow 4s ease-in-out infinite;"></div>
    <svg viewBox="0 0 400 400" style="position:absolute; inset:0; width:100%; height:100%;">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#22D3EE"/>

        </linearGradient>
      </defs>
      <g style="transform-origin:200px 200px; animation: spin 18s linear infinite;">
        <ellipse cx="200" cy="200" rx="170" ry="60" fill="none" stroke="url(#ringGrad)" stroke-width="1.3" opacity="0.55"/>
      </g>
      <g style="transform-origin:200px 200px; animation: spin 26s linear infinite reverse;">
        <ellipse cx="200" cy="200" rx="140" ry="140" fill="none" stroke="url(#ringGrad)" stroke-width="1" opacity="0.35" stroke-dasharray="4 10"/>
      </g>
      <circle cx="200" cy="200" r="86" fill="url(#ringGrad)" opacity="0.9" style="filter:blur(0.5px);">
        <animate attributeName="r" values="82;92;82" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="200" r="50" fill="#0b0f1e" opacity="0.5"/>
      <g style="animation: spin 12s linear infinite;">
        <circle cx="200" cy="60" r="5" fill="#F8FAFC"/>
        <circle cx="340" cy="200" r="4" fill="#22D3EE"/>
        <circle cx="200" cy="340" r="3.5" fill="#A78BFA"/>
      </g>
    </svg>
  </div>`;
}

function viewLanding(){
  return `
  ${navPublic()}
  <main>
    <!-- HERO -->
    <section style="padding:96px 0 60px;">
      <div class="container" style="display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center;">
        <div class="fade-up">
          <span class="badge"><span class="dot"></span> Now with multi-model intelligence</span>
          <h1 class="font-head" style="font-size:56px; line-height:1.05; margin:22px 0 20px; font-weight:700;">Your AI Workspace,<br><span class="gradient-text">Reimagined.</span></h1>
          <p style="color:var(--muted); font-size:18px; line-height:1.6; max-width:520px;">One intelligent workspace for writing, coding, analyzing, creating, and getting more done with AI.</p>
          <div style="display:flex; gap:14px; margin-top:32px; flex-wrap:wrap;">

          </div>

            <div><div class="font-head" style="font-size:26px; font-weight:700;">40M+</div><div style="color:var(--muted); font-size:13px;">Tasks completed</div></div>
            <div><div class="font-head" style="font-size:26px; font-weight:700;">99.9%</div><div style="color:var(--muted); font-size:13px;">Uptime SLA</div></div>
          </div>
        </div>
        <div class="fade-up" style="animation-delay:.1s; animation:floaty 6s ease-in-out infinite;">${heroOrb()}</div>
      </div>
    </section>

    <!-- LOGOS -->
    <section style="padding:20px 0 60px; opacity:.6;">
      <div class="container" style="display:flex; gap:40px; flex-wrap:wrap; justify-content:center; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted);">
        <span>Trusted by teams at</span><span>Vantix</span><span>Lumen Labs</span><span>Orbital</span><span>Fintra</span><span>Wavepoint</span>
      </div>
    </section>

    <!-- FEATURES -->
    <section id="features" style="padding:60px 0;">
      <div class="container">
        <div style="text-align:center; max-width:600px; margin:0 auto 48px;">
          <span class="badge">Capabilities</span>
          <h2 class="font-head" style="font-size:36px; margin-top:16px; font-weight:700;">Everything your work needs, in one place</h2>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px;" class="grid-3">
          ${featureCard('💬','AI Chat Assistant','Natural, context-aware conversations that remember your workflow.')}
          ${featureCard('✍️','AI Writing','Draft, edit, and polish any piece of content in seconds.')}
          ${featureCard('⌨️','AI Coding','Generate, debug, and refactor code across any language.')}
          ${featureCard('🎨','AI Image Generation','Turn ideas into visuals with a single prompt.')}
          ${featureCard('📄','Document Analysis','Extract insights from PDFs, docs, and reports instantly.')}
          ${featureCard('📊','Data Analysis','Understand spreadsheets and datasets without the spreadsheet.')}
        </div>
      </div>
    </section>

    <!-- HOW IT WORKS -->
    <section style="padding:60px 0;">
      <div class="container">
        <div style="text-align:center; max-width:600px; margin:0 auto 48px;">
          <span class="badge">Workflow</span>
          <h2 class="font-head" style="font-size:36px; margin-top:16px; font-weight:700;">From prompt to result, in three steps</h2>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px;" class="grid-3">
          ${stepCard('01','Choose an AI tool','Pick from writing, coding, analysis, and more — built for the task at hand.')}
          ${stepCard('02','Add your prompt or file','Describe what you need, or upload a document to work from.')}
          ${stepCard('03','Get intelligent results','Review, refine, and export — all inside your workspace.')}
        </div>
      </div>
    </section>

    <!-- PRICING -->
    <section id="pricing" style="padding:60px 0;">
      <div class="container">
        <div style="text-align:center; max-width:600px; margin:0 auto 48px;">
          <span class="badge">Pricing</span>
          <h2 class="font-head" style="font-size:36px; margin-top:16px; font-weight:700;">Plans that scale with you</h2>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:20px;" class="grid-3">
          ${pricingCard('Free','$0','/month', ['50 AI requests / month','Core AI tools','1 GB file storage','Community support'], false)}
          ${pricingCard('Pro','$24','/month', ['Unlimited AI requests','All AI tools + priority models','50 GB file storage','Priority support','Advanced analytics'], true)}
          ${pricingCard('Business','$59','/user/month', ['Everything in Pro','Team workspaces','Admin & usage controls','SSO & audit logs','Dedicated onboarding'], false)}
        </div>
      </div>
    </section>

    <!-- TESTIMONIALS -->
    <section style="padding:60px 0;">
      <div class="container">
        <div style="text-align:center; max-width:600px; margin:0 auto 48px;">
          <span class="badge">Loved by builders</span>
          <h2 class="font-head" style="font-size:36px; margin-top:16px; font-weight:700;">What people are creating</h2>
        </div>

async function handleSignup(e){
  e.preventDefault();
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const user = { id: uid(), name, email, password, avatar: name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase(), createdAt: nowISO() };
  DATA = defaultData(user);
  seedUsageIfEmpty(DATA);
  await dbSave(DATA);
  toast(`Welcome to Nexora, ${name.split(' ')[0]}!`, 'success');
  VIEW = 'app'; APP_TAB = 'home';
  render();
  return false;
}

async function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const saved = await dbLoad();
  if(saved && saved.user && saved.user.email.toLowerCase() === email.toLowerCase() && saved.user.password === password){
    DATA = saved; seedUsageIfEmpty(DATA);
    VIEW = 'app'; APP_TAB = 'home';
    toast(`Welcome back, ${DATA.user.name.split(' ')[0]}!`, 'success');
    render();
  } else if(saved && saved.user && saved.user.email.toLowerCase() === email.toLowerCase()){
    toast('Incorrect password.', 'error');
  } else {
    toast('No account found for that email. Try signing up.', 'error');
  }
  return false;
}

async function handleForgot(e){
  e.preventDefault();
  const email = document.getElementById('forgot-email').value.trim();
  toast(`If an account exists for ${email}, a reset link has been sent.`, 'success');
  setView('login');
  return false;
}

// Minimal, safe markdown-ish rendering: code blocks, inline code, bold, line breaks.
function renderMarkdownish(text){
  let t = escapeHtml(text);
  t = t.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    return `<div style="background:#0a0e1c; border:1px solid var(--border); border-radius:10px; margin:8px 0; overflow:hidden;">
      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted);">
        <span>${lang || 'code'}</span>
      </div>
      <pre style="padding:12px; overflow-x:auto; font-size:13px; font-family:monospace; margin:0;"><code>${code}</code></pre>
    </div>`;
  });
  t = t.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:5px; font-size:13px;">$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/\n/g, '<br>');
  return t;
}

function copyMessage(convoId, idx){

function editMessage(convoId, idx){
  const c = DATA.conversations.find(c=>c.id===convoId); if(!c) return;
  CHAT_DRAFT = c.messages[idx].content;

  dbSave(DATA); render();
  setTimeout(()=>{ const el = document.getElementById('chat-input'); if(el){ el.focus(); autoGrow(el);} }, 30);
}
function regenerateMessage(convoId, idx){
  const c = DATA.conversations.find(c=>c.id===convoId); if(!c) return;
  c.messages = c.messages.slice(0, idx); // drop this AI message, resend from history
  dbSave(DATA);
  runAIResponse(c);
}

async function sendChatMessage(){
  const el = document.getElementById('chat-input');
  const text = (el ? el.value : CHAT_DRAFT).trim();
  if(!text || CHAT_STREAMING) return;
  const convo = activeConversation();
  if(!convo) return;
  convo.messages.push({ role:'user', content:text, createdAt: nowISO() });
  if(convo.messages.length === 1) convo.title = text.slice(0,42) + (text.length>42?'…':'');
  convo.updatedAt = nowISO();
  CHAT_DRAFT = '';
  dbSave(DATA);
  render();
  runAIResponse(convo);
}

async function runAIResponse(convo){
  CHAT_STREAMING = true;
  render();
  CHAT_ABORT = new AbortController();
  try{
    const apiMessages = convo.messages.map(m => ({ role: m.role, content: m.content }));
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      signal: CHAT_ABORT.signal,
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: apiMessages,
      })
    });
    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    const reply = textBlocks || "I wasn't able to generate a response — please try again.";
    convo.messages.push({ role:'assistant', content: reply, createdAt: nowISO() });
    convo.updatedAt = nowISO();
    DATA.usage.push({ tool:'AI Chat', tokens: Math.round(reply.length/4) + Math.round(JSON.stringify(apiMessages).length/4), createdAt: nowISO() });
    dbSave(DATA);
  }catch(err){
    if(err.name !== 'AbortError'){
      convo.messages.push({ role:'assistant', content:'Something went wrong reaching the AI model. Please try again.', createdAt: nowISO() });
      toast('AI request failed.', 'error');
    }
  }finally{
    CHAT_STREAMING = false;
    CHAT_ABORT = null;
    render();
  }
}

function stopGenerating(){
  if(CHAT_ABORT) CHAT_ABORT.abort();
  CHAT_STREAMING = false;
  render();
}

async function runTool(){

  TOOL_LOADING = true; render();
  try{
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{ role:'user', content: `You are the "${ACTIVE_TOOL.name}" tool inside an AI SaaS product called Nexora AI. ${ACTIVE_TOOL.desc} Respond directly and usefully to this request:\n\n${input}` }]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    TOOL_RESULT = textBlocks || 'No result generated — try rephrasing your input.';
    DATA.usage.push({ tool: ACTIVE_TOOL.name, tokens: Math.round((input.length+TOOL_RESULT.length)/4), createdAt: nowISO() });
    dbSave(DATA);
  }catch(e){
    TOOL_RESULT = 'Something went wrong generating a result. Please try again.';
    toast('Tool request failed.', 'error');
  }finally{
    TOOL_LOADING = false; render();
  }
}

function detectFileType(name){
  const ext = name.split('.').pop().toLowerCase();
  if(ext==='pdf') return 'pdf';
  if(ext==='docx'||ext==='doc') return 'docx';
  if(ext==='txt') return 'txt';
  if(ext==='csv') return 'csv';
  if(['png','jpg','jpeg','gif','webp'].includes(ext)) return 'image';
  return 'txt';
}

function ingestFiles(fileList){
  FILE_UPLOADING = true; render();
  setTimeout(()=>{
    Array.from(fileList).forEach(f => {

    });
    dbSave(DATA);
    FILE_UPLOADING = false;
    toast(`${fileList.length} file(s) uploaded.`, 'success');
    render();
  }, 900);
}
function handleFileDrop(e){

async function analyzeFile(id){
  const f = DATA.files.find(f=>f.id===id); if(!f) return;
  toast('Analyzing file with AI...', 'info');
  try{
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1000, messages:[{ role:'user', content:`Give a brief plausible-sounding demo analysis (key topics, summary, and one risk/insight) for a user file named "${f.name}" of type ${f.type}. Keep it concise, 4-6 sentences, since the actual file content is not available in this demo.` }] })
    });
    const data = await response.json();
    const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    f.analyzed = true; f.analysis = text || 'Analysis complete.';
    DATA.usage.push({ tool:'Document Analyzer', tokens: 300, createdAt: nowISO() });
    dbSave(DATA);
    render();
    setTimeout(()=> alert ? null : null, 0);
    toast('Analysis ready.', 'success');
    showFileAnalysis(f);
  }catch(e){ toast('Analysis failed.', 'error'); }
}

/* ============ Analytics ============ */
function viewAnalytics(){
  const usage = DATA.usage;
  const totalReqs = usage.length;
  const totalTokens = usage.reduce((s,u)=>s+u.tokens,0);
  const toolCounts = {};
  usage.forEach(u => toolCounts[u.tool] = (toolCounts[u.tool]||0)+1);
  const topTools = Object.entries(toolCounts).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxTool = Math.max(1, ...topTools.map(t=>t[1]));

  // weekly (last 7 days) vs monthly (last 30 days)
  const daysBack = (n) => usage.filter(u => Date.now() - new Date(u.createdAt).getTime() <= n*86400000).length;
  const weekly = daysBack(7), monthly = daysBack(30);

  return `
  <div class="fade-up">
    <h1 class="font-head" style="font-size:24px; font-weight:700; margin-bottom:4px;">Analytics</h1>
    <p style="color:var(--muted); font-size:14px; margin-bottom:24px;">Understand how you're using Nexora AI.</p>

    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;" class="grid-4">
      ${statCard('Total Requests', fmtNum(totalReqs), '📈', 'All time')}
      ${statCard('Token Usage', fmtNum(totalTokens), '⚡', 'All time')}
      ${statCard('This Week', fmtNum(weekly), '🗓', 'Last 7 days')}
      ${statCard('This Month', fmtNum(monthly), '📆', 'Last 30 days')}
    </div>

    <div style="display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:20px;" class="grid-2">
      <div class="glass" style="padding:24px;">
        <h3 class="font-head" style="font-size:16px; margin-bottom:16px;">Daily usage — last 28 days</h3>
        ${dailyBarChart()}
      </div>
      <div class="glass" style="padding:24px;">
        <h3 class="font-head" style="font-size:16px; margin-bottom:16px;">Most used tools</h3>
        <div style="display:flex; flex-direction:column; gap:12px;">
          ${topTools.length ? topTools.map(([name,count]) => `
            <div>
              <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;"><span>${name}</span><span style="color:var(--muted);">${count}</span></div>
              <div style="height:7px; border-radius:99px; background:rgba(255,255,255,0.05); overflow:hidden;">
                <div style="height:100%; width:${(count/maxTool)*100}%; background:linear-gradient(90deg, var(--primary), var(--secondary)); border-radius:99px;"></div>
              </div>
            </div>`).join('') : emptyState('📊','No data yet','Use an AI tool to start generating analytics.')}
        </div>
      </div>
    </div>

    <div class="glass" style="padding:24px;">
      <h3 class="font-head" style="font-size:16px; margin-bottom:16px;">Weekly activity breakdown</h3>
      ${weeklyActivityChart()}
    </div>
  </div>`;
}

function dailyBarChart(){
  const days = [];
  for(let i=27;i>=0;i--){
    const d = new Date(Date.now()-i*86400000);
    const key = d.toDateString();
    const count = DATA.usage.filter(u=> new Date(u.createdAt).toDateString()===key).length;
    days.push(count);
  }
  const max = Math.max(1, ...days);
  return `<div style="display:flex; align-items:flex-end; gap:4px; height:140px;">
    ${days.map(c => `<div style="flex:1; height:${Math.max(3,(c/max)*120)}px; background:linear-gradient(180deg, var(--secondary), var(--primary)); border-radius:4px 4px 2px 2px; opacity:${c?0.9:0.15};" title="${c} requests"></div>`).join('')}
  </div>`;
}

function weeklyActivityChart(){
  const labels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const counts = [0,0,0,0,0,0,0];
  DATA.usage.forEach(u => { const day = (new Date(u.createdAt).getDay()+6)%7; counts[day]++; });
  const max = Math.max(1, ...counts);
  return `<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:14px;">
    ${labels.map((l,i)=>`
      <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
        <div style="width:100%; height:90px; display:flex; align-items:flex-end;">
          <div style="width:100%; height:${Math.max(4,(counts[i]/max)*90)}px; background:linear-gradient(180deg, var(--accent), var(--primary)); border-radius:8px 8px 3px 3px;"></div>
        </div>
        <span style="font-size:12px; color:var(--muted);">${l}</span>
      </div>`).join('')}
  </div>`;
}

    return `
    <h3 class="font-head" style="font-size:17px; margin-bottom:20px;">Profile</h3>
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:24px;">
      <div style="width:64px;height:64px;border-radius:50%; background:linear-gradient(135deg,var(--primary),var(--secondary)); display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700;">${u.avatar}</div>
      <button class="btn btn-ghost btn-sm" onclick="toast('Avatar upload is available on Pro workspaces.','info')">Change avatar</button>
    </div>
    <div style="display:flex; flex-direction:column; gap:16px; max-width:420px;">
      <div class="field"><label>Full name</label><input id="settings-name" class="input" value="${escapeHtml(u.name)}"></div>
      <div class="field"><label>Email</label><input id="settings-email" class="input" value="${escapeHtml(u.email)}"></div>
      <button class="btn btn-primary" style="width:fit-content;" onclick="saveProfile()">Save changes</button>
    </div>`;
  }
  if(UI.settingsTab==='account'){
    return `
    <h3 class="font-head" style="font-size:17px; margin-bottom:20px;">Account</h3>
    <div style="display:flex; flex-direction:column; gap:16px; max-width:420px;">
      <div><div style="font-size:13px; color:var(--muted);">Member since</div><div style="font-weight:600;">${fmtDate(u.createdAt)}</div></div>
      <div><div style="font-size:13px; color:var(--muted);">Current plan</div><div style="font-weight:600;">${DATA.plan}</div></div>
      <button class="btn btn-ghost" style="width:fit-content; color:#ff8fa3; border-color:rgba(255,90,120,0.3);" onclick="confirmDeleteAccount()">Delete account</button>
    </div>`;
  }
  if(UI.settingsTab==='security'){
    return `
    <h3 class="font-head" style="font-size:17px; margin-bottom:20px;">Security</h3>
    <div style="display:flex; flex-direction:column; gap:16px; max-width:420px;">
      <div class="field"><label>Current password</label><input type="password" id="cur-pass" class="input" placeholder="••••••••"></div>
      <div class="field"><label>New password</label><input type="password" id="new-pass" class="input" placeholder="Min. 8 characters"></div>
      <button class="btn btn-primary" style="width:fit-content;" onclick="changePassword()">Update password</button>
    </div>`;
  }
  if(UI.settingsTab==='notifications'){
    return `
    <h3 class="font-head" style="font-size:17px; margin-bottom:20px;">Notifications</h3>
    <div style="display:flex; flex-direction:column; gap:16px; max-width:460px;">
      ${toggleRow('notifyEmail','Email notifications','Get notified about important account activity.')}
      ${toggleRow('notifyProduct','Product updates','News about new features and AI tools.')}
      ${toggleRow('notifyUsage','Usage alerts','Alerts when you approach your plan limits.')}
    </div>`;
  }
  if(UI.settingsTab==='appearance'){
    return `
    <h3 class="font-head" style="font-size:17px; margin-bottom:20px;">Appearance</h3>
    <div style="display:flex; gap:14px;">
      <div class="glass" style="padding:16px; width:140px; text-align:center; border-color:var(--accent);">
        <div style="width:100%; height:70px; border-radius:8px; background:var(--bg); border:1px solid var(--border); margin-bottom:10px;"></div>
        <div style="font-size:13px; font-weight:600;">Dark (active)</div>
      </div>
      <div class="glass" style="padding:16px; width:140px; text-align:center; opacity:.5; cursor:not-allowed;">
        <div style="width:100%; height:70px; border-radius:8px; background:#f4f1ea; margin-bottom:10px;"></div>
        <div style="font-size:13px; font-weight:600;">Light (soon)</div>
      </div>
    </div>`;
  }
  if(UI.settingsTab==='ai'){
    return `
    <h3 class="font-head" style="font-size:17px; margin-bottom:20px;">AI Preferences</h3>
    <div style="display:flex; flex-direction:column; gap:18px; max-width:440px;">
      <div class="field"><label>Default AI model</label>
        <select id="default-model" class="input" onchange="DATA.settings.defaultModel=this.value; dbSave(DATA); toast('Preference saved.','success');">
          ${MODEL_OPTIONS.map(m=>`<option value="${m.id}" ${s.defaultModel===m.id?'selected':''}>${m.label}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Response length</label>
        <select id="response-length" class="input" onchange="DATA.settings.responseLength=this.value; dbSave(DATA); toast('Preference saved.','success');">
          <option value="concise" ${s.responseLength==='concise'?'selected':''}>Concise</option>
          <option value="balanced" ${s.responseLength==='balanced'?'selected':''}>Balanced</option>
          <option value="detailed" ${s.responseLength==='detailed'?'selected':''}>Detailed</option>
        </select>
      </div>
    </div>`;
  }
}

function toggleRow(key,label,sub){
  const on = DATA.settings[key];
  return `<div style="display:flex; justify-content:space-between; align-items:center;">
    <div><div style="font-weight:600; font-size:14px;">${label}</div><div style="color:var(--muted); font-size:12.5px;">${sub}</div></div>
    <div onclick="DATA.settings.${key}=!DATA.settings.${key}; dbSave(DATA); render();" style="width:44px; height:26px; border-radius:99px; background:${on?'linear-gradient(135deg,var(--primary),var(--secondary))':'rgba(255,255,255,0.1)'}; position:relative; cursor:pointer; transition:.2s;">
      <div style="width:20px; height:20px; border-radius:50%; background:#fff; position:absolute; top:3px; left:${on?'21px':'3px'}; transition:.2s;"></div>
    </div>
  </div>`;
}

function saveProfile(){
  const name = document.getElementById('settings-name').value.trim();
  const email = document.getElementById('settings-email').value.trim();
  DATA.user.name = name || DATA.user.name;
  DATA.user.email = email || DATA.user.email;
  DATA.user.avatar = DATA.user.name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase();
  dbSave(DATA);
  toast('Profile updated.', 'success');
  render();
}
function changePassword(){
  const cur = document.getElementById('cur-pass').value;
  const next = document.getElementById('new-pass').value;
  if(cur !== DATA.user.password){ toast('Current password is incorrect.', 'error'); return; }
  if(next.length < 8){ toast('New password must be at least 8 characters.', 'error'); return; }
  DATA.user.password = next; dbSave(DATA);
  toast('Password updated.', 'success'); render();
}
function confirmDeleteAccount(){
  if(confirm('This will permanently delete your Nexora AI workspace. Continue?')){
    window.storage.delete(DB_KEY, false).catch(()=>{});
    DATA = null; VIEW = 'landing';
    toast('Account deleted.', 'info');
    render();
  }
}

</script>
</body>
</html>
